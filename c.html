<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Connect — ScanNow</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>

<div class="screen">
  <div class="center-screen">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div class="brand-name">ScanNow</div>
    </div>

    <div class="card" id="stateCard">
      <div id="content" style="text-align:center;">Loading...</div>
    </div>
  </div>
</div>

<script type="module">
import { auth, db } from './js/firebase.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
import {
  collection, query, where, limit, getDocs, doc, getDoc, setDoc
} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
import { avatarHtml, connectionIdFor, escapeHtml, registerServiceWorker } from './js/util.js';
import { notify } from './js/push.js';

registerServiceWorker();

const params = new URLSearchParams(window.location.search);
const token = params.get('t');
const content = document.getElementById('content');

if (!token) {
  content.innerHTML = `<div class="card-title">Invalid link</div><div class="card-sub">This connect link is missing its code.</div>`;
} else {
  onAuthStateChanged(auth, (user) => {
    handleFlow(user).catch((err) => {
      console.error('c.html handleFlow error:', err);
      content.innerHTML = `<div class="card-title">Something went wrong</div><div class="card-sub">Please try scanning the code again.</div>`;
    });
  });
}

async function findOwnerByToken(t) {
  const q = query(collection(db, 'users'), where('qrToken', '==', t), limit(1));
  const snap = await getDocs(q);
  if (snap.empty) return null;
  return { uid: snap.docs[0].id, ...snap.docs[0].data() };
}

// Firestore rules require auth to read the users collection, so a scanner
// who isn't signed in yet can't run that query client-side — it would throw
// permission-denied and leave the page stuck on "Loading...". This function
// does the lookup server-side instead, for the signed-out case only.
async function findOwnerByTokenPublic(t) {
  const res = await fetch(`.netlify/functions/find-owner-by-token?t=${encodeURIComponent(t)}`);
  const data = await res.json();
  return data.owner;
}

async function handleFlow(user) {
  const owner = user ? await findOwnerByToken(token) : await findOwnerByTokenPublic(token);

  if (!owner) {
    content.innerHTML = `<div class="card-title">Code not found</div><div class="card-sub">This QR code isn't active anymore — the person may have reset it. Ask them to share their current code.</div>`;
    return;
  }

  if (!user) {
    renderSignedOutPrompt(owner);
    return;
  }

  if (user.uid === owner.uid) {
    content.innerHTML = `${avatarHtml(owner.photoUrl, owner.firstName, 'avatar-lg', 'margin:0 auto 12px;')}<div class="card-title">This is your own code!</div><div class="card-sub">Share it with someone else to connect.</div><a href="app.html" class="btn btn-primary" style="margin-top:8px;">Back to ScanNow</a>`;
    return;
  }

  const myDoc = await getDoc(doc(db, 'users', user.uid));
  const me = myDoc.data();

  if ((me.blockedUids || []).includes(owner.uid) || (owner.blockedUids || []).includes(user.uid)) {
    content.innerHTML = `<div class="card-title">Can't connect</div><div class="card-sub">This code isn't available.</div><a href="app.html" class="btn btn-outline" style="margin-top:8px;">Back to ScanNow</a>`;
    return;
  }

  const connId = connectionIdFor(user.uid, owner.uid);
  const existing = await getDoc(doc(db, 'connections', connId));

  if (existing.exists()) {
    const data = existing.data();
    if (data.status === 'accepted') {
      content.innerHTML = `${avatarHtml(owner.photoUrl, owner.firstName, 'avatar-lg', 'margin:0 auto 12px;')}<div class="card-title">Already connected</div><div class="card-sub">You and ${escapeHtml(owner.firstName)} are already connected.</div><a href="chat.html?c=${connId}" class="btn btn-primary" style="margin-top:8px;">Message ${escapeHtml(owner.firstName)}</a>`;
    } else {
      content.innerHTML = `${avatarHtml(owner.photoUrl, owner.firstName, 'avatar-lg', 'margin:0 auto 12px;')}<div class="card-title">Request already sent</div><div class="card-sub">Waiting for ${escapeHtml(owner.firstName)} to approve your request.</div><a href="app.html" class="btn btn-outline" style="margin-top:8px;">Back to ScanNow</a>`;
    }
    return;
  }

  renderConnectPrompt(owner, connId, user.uid, me.firstName);
}

function renderSignedOutPrompt(owner) {
  content.innerHTML = `
    ${avatarHtml(owner.photoUrl, owner.firstName, 'avatar-lg', 'margin:0 auto 12px;')}
    <div class="card-title">Connect with ${escapeHtml(owner.firstName)}?</div>
    <div class="card-sub">Sign up free to send a connection request. Nothing happens until they approve it.</div>
    <button class="btn btn-primary" id="signupBtn">Sign Up to Connect</button>
    <div class="link-row">Already have an account? <a href="#" id="signinLink">Sign in</a></div>
  `;
  document.getElementById('signupBtn').addEventListener('click', () => {
    sessionStorage.setItem('scannow_pending_connect', token);
    window.location.href = 'login.html';
  });
  document.getElementById('signinLink').addEventListener('click', (e) => {
    e.preventDefault();
    sessionStorage.setItem('scannow_pending_connect', token);
    window.location.href = 'login.html';
  });
}

function renderConnectPrompt(owner, connId, myUid, myName) {
  const ageNote = owner.isMinor
    ? `<div class="notice">This person is under 18.</div>`
    : '';
  content.innerHTML = `
    ${avatarHtml(owner.photoUrl, owner.firstName, 'avatar-lg', 'margin:0 auto 12px;')}
    <div class="card-title">Connect with ${escapeHtml(owner.firstName)}?</div>
    <div class="card-sub">They'll need to approve before you can message each other. Only your first name and photo are shared — never your last name, and no contact info unless you choose to add it.</div>
    ${ageNote}
    <button class="btn btn-primary" id="sendRequestBtn">Send Connection Request</button>
    <a href="app.html" class="link-row" style="display:block;">Not now</a>
  `;
  document.getElementById('sendRequestBtn').addEventListener('click', async () => {
    const btn = document.getElementById('sendRequestBtn');
    btn.disabled = true;
    btn.textContent = 'Sending...';
    await setDoc(doc(db, 'connections', connId), {
      uids: [myUid, owner.uid],
      status: 'pending',
      requestedBy: myUid,
      requestedAt: new Date().toISOString(),
    });
    notify(owner.uid, `${myName} wants to connect`, 'Open ScanNow to approve or decline.', 'app.html');
    content.innerHTML = `${avatarHtml(owner.photoUrl, owner.firstName, 'avatar-lg', 'margin:0 auto 12px;')}<div class="card-title">Request sent!</div><div class="card-sub">${escapeHtml(owner.firstName)} will get a notification to approve it.</div><a href="app.html" class="btn btn-primary" style="margin-top:8px;">Back to ScanNow</a>`;
  });
}
</script>

</body>
</html>
