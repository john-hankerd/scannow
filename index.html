<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ScanNow — Connect without giving out your number</title>
<meta name="description" content="Share a QR code instead of your phone number. Scan, approve, chat — no numbers, no photos, ever.">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>

<div class="loading-center">Loading...</div>

<script type="module">
import { auth } from './js/firebase.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
import { registerServiceWorker } from './js/util.js';

registerServiceWorker();

onAuthStateChanged(auth, (user) => {
  window.location.href = user ? 'app.html' : 'login.html';
});
</script>

</body>
</html>
